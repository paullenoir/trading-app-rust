<!-- Fonts - OPTIMISÉ: Seulement les fonts utilisées -->

<style>
body {
font-family: 'Geist', sans-serif;
background-color: #0A0B0E;
color: #e2e8f0;
}
.font-geist { font-family: 'Geist', sans-serif !important; }

/* Custom Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #262626; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #404040; }

/* Animation Keyframes */
@keyframes animationIn {
0% { opacity: 0; transform: translateY(20px); filter: blur(4px); }
100% { opacity: 1; transform: translateY(0); filter: blur(0px); }
}

/* 3D Transform Utilities */
.perspective-distant { perspective: 1200px; }
.transform-style-preserve-3d { transform-style: preserve-3d; }

/* Shiny Button Logic */
@property --gradient-angle { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
@property --gradient-angle-offset { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
@property --gradient-shine { syntax: "<color>"; initial-value: #2dd4bf; inherits: false; }

.shiny-cta {
--gradient-angle: 0deg; --gradient-angle-offset: 0deg; --gradient-shine: #2dd4bf;
background: linear-gradient(#000000, #000000) padding-box,
conic-gradient(from calc(var(--gradient-angle) - var(--gradient-angle-offset)),
transparent 0%, #0f766e 5%, var(--gradient-shine) 15%,
#0f766e 30%, transparent 40%, transparent 100%) border-box;
animation: border-spin 3s linear infinite;
}
@keyframes border-spin { to { --gradient-angle: 360deg; } }

/* Custom Checkbox */
.custom-checkbox:checked + div {
background-color: #2dd4bf;
border-color: #2dd4bf;
}
.custom-checkbox:checked + div svg {
display: block;
}

/* ========================================
   BACKGROUND ANIMÉ - CSS PUR
   ======================================== */

/* Gradients animés qui bougent */
@keyframes gradient-shift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.animated-gradient {
    background: linear-gradient(
        -45deg,
        #0A0B0E 0%,
        #0d1117 20%,
        rgba(16, 185, 129, 0.08) 40%,
        rgba(6, 182, 212, 0.08) 60%,
        #0d1117 80%,
        #0A0B0E 100%
    );
    background-size: 400% 400%;
    animation: gradient-shift 15s ease infinite;
}

/* Particules flottantes */
@keyframes float-up {
    0% {
        transform: translateY(100vh) translateX(0) scale(0);
        opacity: 0;
    }
    10% {
        opacity: 0.3;
    }
    90% {
        opacity: 0.3;
    }
    100% {
        transform: translateY(-100vh) translateX(100px) scale(1);
        opacity: 0;
    }
}

.particle {
    position: absolute;
    top: 100vh; /* Départ forcé hors écran en bas */
    width: 4px;
    height: 4px;
    background: linear-gradient(135deg, #10b981, #06b6d4);
    border-radius: 50%;
    box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
    animation: float-up linear infinite;
}

.particle:nth-child(1) { left: 10%; animation-duration: 25s; animation-delay: 0s; }
.particle:nth-child(2) { left: 20%; animation-duration: 30s; animation-delay: 2s; width: 3px; height: 3px; }
.particle:nth-child(3) { left: 30%; animation-duration: 28s; animation-delay: 4s; }
.particle:nth-child(4) { left: 40%; animation-duration: 32s; animation-delay: 1s; width: 5px; height: 5px; }
.particle:nth-child(5) { left: 50%; animation-duration: 27s; animation-delay: 3s; }
.particle:nth-child(6) { left: 60%; animation-duration: 29s; animation-delay: 5s; width: 3px; height: 3px; }
.particle:nth-child(7) { left: 70%; animation-duration: 31s; animation-delay: 0s; }
.particle:nth-child(8) { left: 80%; animation-duration: 26s; animation-delay: 2s; width: 4px; height: 4px; }
.particle:nth-child(9) { left: 90%; animation-duration: 33s; animation-delay: 4s; }
.particle:nth-child(10) { left: 15%; animation-duration: 28s; animation-delay: 1s; }
.particle:nth-child(11) { left: 25%; animation-duration: 30s; animation-delay: 3s; width: 3px; height: 3px; }
.particle:nth-child(12) { left: 35%; animation-duration: 27s; animation-delay: 5s; }
.particle:nth-child(13) { left: 45%; animation-duration: 31s; animation-delay: 0s; width: 5px; height: 5px; }
.particle:nth-child(14) { left: 55%; animation-duration: 29s; animation-delay: 2s; }
.particle:nth-child(15) { left: 65%; animation-duration: 32s; animation-delay: 4s; width: 3px; height: 3px; }
.particle:nth-child(16) { left: 75%; animation-duration: 26s; animation-delay: 1s; }
.particle:nth-child(17) { left: 85%; animation-duration: 28s; animation-delay: 3s; width: 4px; height: 4px; }
.particle:nth-child(18) { left: 95%; animation-duration: 30s; animation-delay: 5s; }
.particle:nth-child(19) { left: 5%; animation-duration: 27s; animation-delay: 2s; }
.particle:nth-child(20) { left: 12%; animation-duration: 29s; animation-delay: 4s; width: 3px; height: 3px; }

/* Orbes lumineux qui pulsent */
@keyframes pulse-orb {
    0%, 100% {
        transform: scale(1) translate(0, 0);
        opacity: 0.3;
    }
    50% {
        transform: scale(1.5) translate(20px, 20px);
        opacity: 0.6;
    }
}

.orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    animation: pulse-orb 8s ease-in-out infinite;
}

.orb-1 {
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(16, 185, 129, 0.3), transparent);
    top: 10%;
    left: 10%;
    animation-delay: 0s;
}

.orb-2 {
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(6, 182, 212, 0.25), transparent);
    top: 50%;
    right: 10%;
    animation-delay: 3s;
}

.orb-3 {
    width: 250px;
    height: 250px;
    background: radial-gradient(circle, rgba(16, 185, 129, 0.2), transparent);
    bottom: 10%;
    left: 50%;
    animation-delay: 6s;
}

/* Grid cyberpunk */
.cyber-grid {
    background-image: 
        linear-gradient(rgba(16, 185, 129, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(16, 185, 129, 0.03) 1px, transparent 1px);
    background-size: 50px 50px;
    opacity: 0.4;
}
</style>

    <!-- JavaScript pour toggle password visibility -->
    <script>
    function togglePassword(inputId, button) {
        const input = document.getElementById(inputId);
        const icon = button.querySelector('iconify-icon');
        
        if (input.type === 'password') {
            input.type = 'text';
            icon.setAttribute('icon', 'solar:eye-closed-linear');
        } else {
            input.type = 'password';
            icon.setAttribute('icon', 'solar:eye-linear');
        }
    }
    </script>
